; Per-directory PHP settings for cPanel / Apache.
;
; The admin panel uploads PDFs and photos, and PHP's stock 2M upload
; limit rejects them before any of our code runs. These raise it.
; (PHP caches this file for a few minutes, so a change here is not
; always visible on the very next page load.)
upload_max_filesize = 40M
post_max_size = 45M
max_file_uploads = 60
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; On the live site set these to Off / E_ALL & ~E_DEPRECATED so visitors
; never see a PHP error message. Left on while the site is being set up,
; because a blank page tells you nothing.
display_errors = On
error_reporting = E_ALL
