; Same purpose as the php_value block in .htaccess, but for PHP-FPM /
; CGI style hosting (common on cPanel's "ea-phpNN" handler), where
; .htaccess php_value lines are ignored but .user.ini is read instead.
; It can take a few minutes for PHP-FPM to pick this up after upload.
upload_max_filesize = 40MB
post_max_size = 45MB
max_file_uploads = 60
max_execution_time = 120
max_input_time = 120
memory_limit = 256MB